<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miqdamocta's Space</title>
    <style>
        :root {
            --bg: #282828;
            --fg: #ebdbb2;
            --accent: #fabd2f;
            --secondary: #83a598;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid var(--accent);
            padding: 2rem;
            border-radius: 15px;
            background: #3c3836;
            box-shadow: 10px 10px 0px var(--accent);
            max-width: 80%;
        }
        h1 { color: var(--accent); margin-bottom: 0.5rem; }
        p { font-size: 1.2rem; }
        .cat-emoji { font-size: 3rem; display: block; margin-bottom: 1rem; }
        .links a {
            color: var(--secondary);
            text-decoration: none;
            margin: 0 10px;
            border: 1px solid var(--secondary);
            padding: 5px 10px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .links a:hover {
            background: var(--secondary);
            color: var(--bg);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="cat-emoji">ฅ(=^･ω･^=)ฅ</span>
        <h1>Welcome to Miqdamocta's Space!</h1>
        <p>A minimalist corner of the internet, <br> curated with help from Mokahime. Nyaaa~!</p>
        <div class="links">
            <a href="https://github.com/Miqdamocta">GitHub</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>
</body>
</html>
